scopes:
  source:
    files:
      api:
        include:
          - services/api/**/*
      web:
        include:
          - apps/web/**/*
  barrier_files:
    - .github/workflows/**

queue_rules:
  - name: default
    autoqueue: true
    queue_conditions:
      - base=main
      - label=queue-me
    merge_conditions:
      - label=allow-merge
