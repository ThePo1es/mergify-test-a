queue_rules:
  - name: default
    queue_conditions:
      - base=main
    merge_conditions: []

merge_protections:
  - name: security review required
    description: nothing may merge without the security-reviewed label
    if:
      - base = main
    success_conditions:
      - label = security-reviewed

pull_request_rules:
  - name: auto queue
    conditions:
      - base=main
      - label=queue-me
    actions:
      queue:
        name: default
