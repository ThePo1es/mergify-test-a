name: trust-probe
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "event_name       = ${{ github.event_name }}"
          echo "head_repository  = ${{ github.event.pull_request.head.repo.full_name }}"
          echo "base_repository  = ${{ github.event.pull_request.base.repo.full_name }}"
          echo "head_ref         = ${{ github.head_ref }}"
          echo "actor            = ${{ github.actor }}"
          echo "token_perms_note = see the run's permissions block"
      - name: secret availability (presence only — the value is never printed or sent)
        env:
          CANARY: ${{ secrets.LAB_CANARY }}
        run: |
          if [ -n "$CANARY" ]; then
            echo "SECRET_AVAILABLE=yes  length=${#CANARY}"
          else
            echo "SECRET_AVAILABLE=no"
          fi
      - name: GITHUB_TOKEN write capability (probe, no mutation)
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GT" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}")
          echo "GITHUB_TOKEN repo read -> $code"
          echo "token can write? checking collaborator permission endpoint"
          perm=$(curl -s -H "Authorization: Bearer $GT" \
            "https://api.github.com/repos/${{ github.repository }}" | grep -o '"push":[a-z]*' | head -1)
          echo "repo.permissions -> ${perm:-unknown}"
