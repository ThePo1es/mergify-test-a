name: gate
on:
  pull_request:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verdict
        run: |
          echo "--- probe/ ---"; ls -la probe/ 2>/dev/null || echo "(none)"
          a=0; c=0
          [ -f probe/a.txt ] && a=1
          [ -f probe/c.txt ] && c=1
          echo "a=$a c=$c"
          if [ "$a" = 1 ] && [ "$c" = 1 ]; then
            echo "INCOMPATIBLE COMBINATION: probe/a.txt and probe/c.txt both present -> FAIL"
            exit 1
          fi
          echo "compatible -> PASS"
